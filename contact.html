<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Dani</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">Dani</h1>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Startseite</a></li>
                <li><a href="about.html" class="nav-link">Über Mich</a></li>
                <li><a href="contact.html" class="nav-link active">Kontakt</a></li>
            </ul>
        </div>
    </nav>

    <section class="contact">
        <div class="container">
            <h2>Kontakt</h2>
            <p class="contact-intro">Hast du Fragen oder möchtest du mich erreichen? Du kennst mich ja... </p>
            
            <div class="contact-content">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-Mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Betreff:</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Nachricht:</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="submit-button">Nachricht senden</button>
                </form>

                <div class="contact-info">
                    <h3>Andere Kontaktmöglichkeiten</h3>
                    <div class="info-item">
                        <h4>📧 E-Mail</h4>
                        <p><a href="mailto:info@example.com">info@example.com</a></p>
                    </div>
                    <div class="info-item">
                        <h4>📱 Telefon</h4>
                        <p><a href="tel:+41791234567">+41 79 123 45 67</a></p>
                    </div>
                    <div class="info-item">
                        <h4>🔗 Social Media</h4>
                        <p>
                            <a href="#">LinkedIn</a> | 
                            <a href="#">Twitter</a> | 
                            <a href="#">GitHub</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 Dani. Alle Rechte vorbehalten.</p>
    </footer>
</body>
</html>
